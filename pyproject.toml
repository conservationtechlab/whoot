[project]
name = "whoot"
version = "0.0.2.dev0"
description = "Tools for capturing, analyzing, and parsing audio data"
readme = "README.md"
requires-python = ">= 3.10.0, < 3.13.0"
dependencies = [
    "librosa>=0.10.2.post1",
    "numba==0.61.0",
    "pandas>=2.3.0",
    "pydub>=0.25.1",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.7.0",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
cpu = [
  "torch>=2.7.0",
  "torchvision>=0.22.0",
]
cu128 = [
  "torch>=2.7.0",
  "torchvision>=0.22.0",
]
model-training = [
  "datasets>=3.5.1,<4.0.0",
  "timm>=1.0.15",
  "pyha-analyzer@git+https://github.com/UCSD-E4E/pyha-analyzer-2.0.git@support_whoot",
  "comet-ml>=3.43.2",
]

notebooks = [
  "ipykernel>=6.29.5",
  "ipywidgets>=8.1.6",
]


[packages.index]
cu128 = "https://download.pytorch.org/whl/cu128"

[tool.setuptools]
packages = ["whoot"]

[tool.uv.sources]
pyha-analyzer = { git = "https://github.com/UCSD-E4E/pyha-analyzer-2.0.git", branch = "support_whoot" }
whoot = { workspace = true }

[dependency-groups]
dev = [
    "whoot",
]
