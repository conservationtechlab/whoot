[project]
name = "whoot"
dynamic = ["version"]
description = "Tools for capturing, analyzing, and parsing audio data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "librosa>=0.11.0",
    "numpy>=2.2.6",
    "pandas>=2.3.0",
    "pydub>=0.25.1",
    "scikit-learn>=1.7.0",
    "tqdm>=4.67.1",
]

[tool.setuptools.dynamic]
version = {attr = "whoot.__version__"}

[project.optional-dependencies]
cpu = [
  "torch>=2.7.0",
  "torchvision>=0.22.0",
]
cu128 = [
  "torch>=2.7.0",
  "torchvision>=0.22.0",
]
dev = [
    "flake8>=7.3.0",
    "pylint>=3.3.7",
]

[packages.index]
cu128 = "https://download.pytorch.org/whl/cu128"

[tool.setuptools]
packages = ["make_model", "assess_birdnet"]
